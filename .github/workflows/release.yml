name: release

# Auto-drafts a GitHub Release whenever the manifest version changes on main:
# waits for CI to pass on the commit, tags v<version>, builds the store zip,
# generates notes, uploads the asset — then stops at a DRAFT so a human
# reviews and publishes.
#
# Why paths: [manifest.json]? The version is the release signal; touching any
# other file (or a manifest edit that does NOT change the version) skips the
# job via the version-diff check below.
#
# Why wait for CI before tagging? The tag is a durable artifact — if we tagged
# a red commit and CI later failed, a fix-forward commit would orphan a stale
# tag pointing at broken code (the tag-drift gotcha, RELEASING.md §3). The
# draft is a human gate; this CI gate protects the tag itself.
#
# Why a draft and not a published release? target_commitish is frozen at
# creation (RELEASING.md §3), so releases should never be created from a red
# commit. `workflow_dispatch` with force: true re-runs a failed attempt.

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
    inputs:
      force:
        description: 'Draft the release even if the version is unchanged (retry a failed run)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      # Full history: needed to (1) diff the manifest version against the last
      # v* tag and (2) build the commit list for the release notes.
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # package-release.sh needs the `zip` binary (not preinstalled on
      # ubuntu-latest — the CI package-check job installs it the same way).
      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Detect version bump
        id: version
        env:
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          OLD=""
          if [ -n "$LAST_TAG" ]; then
            OLD=$(git show "$LAST_TAG":manifest.json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" || true)
          fi
          if git tag -l "v$NEW" | grep -q .; then TAG_EXISTS=yes; else TAG_EXISTS=no; fi
          if gh release view "v$NEW" --json tagName -q .tagName > /dev/null 2>&1; then RELEASE_EXISTS=yes; else RELEASE_EXISTS=no; fi
          echo "new=$NEW old=$OLD tag_exists=$TAG_EXISTS release_exists=$RELEASE_EXISTS"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EXISTS" = "yes" ]; then
            echo "release v$NEW already exists — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$TAG_EXISTS" = "yes" ]; then
            # Tag pushed but no release — retry a partially-failed run.
            echo "tag v$NEW exists with no release — retrying release creation"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$NEW" = "$OLD" ] && [ "$FORCE" != "true" ]; then
            echo "version unchanged ($NEW) — skipping (use workflow_dispatch with force: true to retry)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version bumped $OLD -> $NEW — drafting release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the CI run on this exact commit to finish green before
      # tagging. `gh run watch --exit-status` blocks until the run completes
      # and exits non-zero on failure; poll for the run to appear first
      # (release.yml and ci.yml start concurrently on the same push).
      - name: Wait for CI to pass on this commit
        id: ci
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          RUN=""
          for i in $(seq 1 60); do
            RUN=$(gh run list --head_sha "$SHA" --limit 10 --json databaseId,workflowName -q '.[] | select(.workflowName == "CI") | .databaseId' | head -1 || true)
            [ -n "$RUN" ] && break
            sleep 10
          done
          if [ -z "$RUN" ]; then
            echo "no CI run found for $SHA — skipping release (never tag an unvetted commit)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh run watch "$RUN" --exit-status --interval 20; then
            echo "CI green for $SHA"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI failed for $SHA — skipping release (fix forward, then re-dispatch with force)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create v<version> tag
        if: steps.version.outputs.skip == 'false' && steps.ci.outputs.ok == 'true' && steps.version.outputs.tag_exists == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin "v${{ steps.version.outputs.new }}"
          echo "pushed tag v${{ steps.version.outputs.new }}"

      - name: Build store zip
        if: steps.version.outputs.skip == 'false' && steps.ci.outputs.ok == 'true'
        run: bash scripts/package-release.sh

      - name: Generate release notes
        id: notes
        if: steps.version.outputs.skip == 'false' && steps.ci.outputs.ok == 'true'
        run: |
          bash scripts/make-release-notes.sh             "${{ steps.version.outputs.old }}"             "${{ steps.version.outputs.new }}" > /tmp/release-notes.md
          echo "file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          head -3 /tmp/release-notes.md

      - name: Draft release + upload zip
        if: steps.version.outputs.skip == 'false' && steps.ci.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          gh release create "v$NEW"             --title "Vinland v$NEW"             --notes-file "${{ steps.notes.outputs.file }}"             --draft             "dist/vinland-v$NEW.zip"
          gh release view "v$NEW" --json tagName,isDraft,name -q '{tag: .tagName, draft: .isDraft, name: .name}'
