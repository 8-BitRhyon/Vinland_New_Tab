name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Docs drift gate: docs/DEVELOPMENT.md function inventories must stay
      # in sync with the source (regenerate with `npm run docs`).
      - name: Check function inventories are in sync
        run: npm run docs:check

  # E2E tests (Playwright) — split into 4 parallel shards so the suite
  # finishes well within job time limits. The Playwright config auto-starts
  # `python3 -m http.server 9999` as the web server (see playwright.config.mjs).
  # The CLI command sweep is excluded here and runs in its own dedicated job
  # (cli-sweep) so it has isolated runtime, clear failure attribution, and
  # doesn't double-run inside the sharded matrix.
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --grep-invert "CLI command sweep|Release Candidate" --shard=${{ matrix.shard }}/4
        timeout-minutes: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # CLI command sweep — dedicated job. Runs all 34 registered commands via
  # the CLI input with deterministic assertions (weather APIs are mocked via
  # Playwright route interception, so no network flake). Isolated here so the
  # sharded E2E suite above stays fast and the sweep gets its own timeout +
  # failure artifacts.
  cli-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CLI command sweep
        run: npx playwright test tests/cli-commands.playwright.spec.mjs
        timeout-minutes: 15

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cli-sweep
          path: playwright-report/
          retention-days: 7

  # Release-candidate smoke — the ONLY job that runs the real unpacked
  # extension in a persistent Chromium profile (chrome-extension:// origin,
  # MV3 service worker, chrome.identity/storage present). Excluded from the
  # sharded E2E matrix above via --grep-invert "Release Candidate". Slow
  # (boots a full extension profile) so it gets its own job + timeout.
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run release-candidate smoke (real extension context)
        run: npx playwright test tests/release-candidate.playwright.spec.mjs
        timeout-minutes: 15

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release-candidate
          path: playwright-report/
          retention-days: 7

  # Store-package gate — builds the Chrome-Web-Store zip via
  # scripts/package-release.sh so packaging failures break CI instead of
  # shipping. The script's 80MB size guard (CWS caps at 100MB) exits 1 on
  # silent asset bloat, and its composition report prints the 10 largest
  # included paths so the top offenders are visible right in the run log.
  # Fast job: only needs python3 + zip/unzip (no Node deps).
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build store zip (80MB size guard + composition report)
        run: bash scripts/package-release.sh

      # Upload on success AND failure: when the 80MB guard trips, the zip was
      # already built (the guard runs after zip -r), so a maintainer can
      # download the bloated zip from a failed run and inspect it directly.
      - name: Upload store zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinland-store-zip
          path: dist/*.zip
          retention-days: 7

  # Firefox/Zen build gate — builds the WebExtensions zip by merging
  # manifest.firefox.json over the Chrome manifest (single source of truth)
  # and asserts the merged manifest shape: stable gecko id, background.scripts
  # event page, and NO Chrome-only keys (oauth2, service_worker, type: module).
  # Zen is Firefox-based; Dia and other Chromium browsers use the store zip
  # built in package-check. Same python3 + zip/unzip footprint as that job.
  firefox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build Firefox/Zen zip (merge + validate + package)
        run: bash scripts/package-firefox.sh

      # The merge + manifest shape (gecko id, background.scripts, no
      # Chrome-only keys) is already asserted inside package-firefox.sh; this
      # step just confirms the artifact itself carries a parseable manifest.json.
      - name: Verify packaged manifest.json in the zip
        run: |
          unzip -l dist-firefox/*.zip | grep -q manifest.json
          unzip -p dist-firefox/*.zip manifest.json | python3 -c "import json,sys; json.load(sys.stdin); print('packaged manifest.json parses OK')"

      - name: Upload Firefox zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinland-firefox-zip
          path: dist-firefox/*.zip
          retention-days: 7

  # Firefox runtime smoke test — loads the PACKAGED zip (the same artifact
  # firefox-build uploads) into a headless real Firefox via Mozilla's web-ext
  # and asserts: (1) the add-on installs as a temporary add-on, and (2) the
  # background script boots with ZERO JavaScript errors on Firefox's stderr.
  # This is the runtime half of the Firefox/Zen gate that package-firefox.sh's
  # static shape assertions cannot cover — it already caught a real bug
  # (chrome.alarms undefined in Firefox + missing 'alarms' manifest permission).
  # Playwright's bundled Firefox cannot load extensions at all, so web-ext +
  # a real Firefox binary is the reliable path here.
  firefox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Install Firefox
        id: install-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest'

      - name: Build Firefox/Zen zip (merge + validate + package)
        run: bash scripts/package-firefox.sh

      # browser-actions/setup-firefox exposes the binary path as the
      # `firefox-path` output; pass it through as FIREFOX_BINARY (the smoke
      # script also falls back to `firefox` on PATH). web-ext is a
      # devDependency (npm ci above). Firefox runs headless via MOZ_HEADLESS=1.
      - name: Run Firefox runtime smoke test (web-ext + headless Firefox)
        run: FIREFOX_BINARY="${{ steps.install-firefox.outputs.firefox-path }}" bash scripts/firefox-smoke-test.sh
        timeout-minutes: 5
