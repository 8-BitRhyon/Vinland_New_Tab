name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # E2E tests (Playwright) — split into 4 parallel shards so the suite
  # finishes well within job time limits. The Playwright config auto-starts
  # `python3 -m http.server 9999` as the web server (see playwright.config.mjs).
  # The CLI command sweep is excluded here and runs in its own dedicated job
  # (cli-sweep) so it has isolated runtime, clear failure attribution, and
  # doesn't double-run inside the sharded matrix.
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --grep-invert "CLI command sweep|Release Candidate" --shard=${{ matrix.shard }}/4
        timeout-minutes: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # CLI command sweep — dedicated job. Runs all 34 registered commands via
  # the CLI input with deterministic assertions (weather APIs are mocked via
  # Playwright route interception, so no network flake). Isolated here so the
  # sharded E2E suite above stays fast and the sweep gets its own timeout +
  # failure artifacts.
  cli-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CLI command sweep
        run: npx playwright test tests/cli-commands.playwright.spec.mjs
        timeout-minutes: 15

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cli-sweep
          path: playwright-report/
          retention-days: 7

  # Release-candidate smoke — the ONLY job that runs the real unpacked
  # extension in a persistent Chromium profile (chrome-extension:// origin,
  # MV3 service worker, chrome.identity/storage present). Excluded from the
  # sharded E2E matrix above via --grep-invert "Release Candidate". Slow
  # (boots a full extension profile) so it gets its own job + timeout.
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run release-candidate smoke (real extension context)
        run: npx playwright test tests/release-candidate.playwright.spec.mjs
        timeout-minutes: 15

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-release-candidate
          path: playwright-report/
          retention-days: 7
